# MindSpark: ThoughtForge — User Configuration
# Generated by setup_thoughtforge.py
# Edit manually or re-run setup to change.

backend: none   # none | ollama | lmstudio | openai_compatible | huggingface | turboquant

# Ollama settings
ollama_url: "http://localhost:11434"
ollama_model: ""

# LM Studio / OpenAI-compatible settings
lmstudio_url: "http://localhost:1234"
lmstudio_model: ""
# TF-160 (Kista custody): credentials never live in configs as
# values — this key is a custody REFERENCE into Kista, not a key.
openai_api_key_ref: "kista://thoughtforge/openai_api_key"
openai_base_url: ""

# HuggingFace settings
# TF-160 (Kista custody): a custody REFERENCE, never a token value.
hf_token_ref: "kista://thoughtforge/hf_token"
hf_model: ""

# Local GGUF (TurboQuant/llama-cpp-python)
gguf_model_path: ""

# Hardware profile: auto | phone_low | pi_zero | pi_5 | desktop_cpu | desktop_gpu | server_gpu
profile: auto

# Knowledge base
knowledge_db_built: false

# Chat settings
chat_max_turns: 20
chat_system_prompt: ""
chat_save_history: true
